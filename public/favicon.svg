<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Minimalist editorial monogram - no background, transparent -->
  
  <!-- Letter M - primary taupe, thin stroke like the design system -->
  <path d="M20 80 L20 30 Q20 25 25 25 L38 25 L50 50 L62 25 L75 25 Q80 25 80 30 L80 80" 
        fill="none" 
        stroke="#715b3e" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Subtle crown accent - smaller, secondary color -->
  <path d="M40 22 L45 15 L50 20 L55 15 L60 22" 
        fill="none" 
        stroke="#625e51" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>